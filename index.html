<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crachá Digital</title>

<style>
body{
    background:#eef0f7;
    font-family:Arial, sans-serif;
    margin:0;
    padding:20px;
}

.card{
    max-width:700px;
    margin:auto;
}

.top{
    display:flex;
    gap:20px;
}

.foto, .qr{
    background:white;
    border-radius:20px;
    padding:10px;
    flex:1;
}

.foto img,
.qr img{
    width:100%;
    border-radius:15px;
}

.info{
    background:white;
    margin-top:20px;
    border-radius:20px;
    padding:25px;
}

h2{
    margin-top:0;
}

p{
    font-size:20px;
    margin:12px 0;
}

.aviso{
    text-align:center;
    margin-top:20px;
    color:#777;
}
</style>
</head>

<body>

<div class="card">

    <div class="top">

        <div class="foto">
            <img src="foto.jpg">
        </div>

        <div class="qr">
            <img src="qrcode.png">
        </div>

    </div>

    <div class="info">
        <h2>Beatriz Teixeira</h2>

        <p><strong>Função:</strong> Membro</p>

        <p><strong>Associação:</strong> Uso Interno</p>

        <p><strong>ID:</strong> 100823</p>

        <p><strong>Validade:</strong> 31/12/2028</p>
    </div>

    <div class="aviso">
        Documento de uso interno
    </div>

</div>

</body>
</html>
