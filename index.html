<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="theme-color" content="#dde2ee">

    <link rel="manifest" href="/manifest.json">

    <title>DNE - Documento Nacional do Estudante</title>

    <script defer="defer" src="/static/js/main.709f69f0.js"></script>
    <link href="/static/css/main.3eee1d93.css" rel="stylesheet">
</head>

<body>
    <noscript>
        You need to enable JavaScript to run this app.
    </noscript>

    <div id="root">
        <div class="App">

            <!-- Header -->
            <div class="header">

                <div class="item">
                    <img
                        width="90px"
                        src="/static/media/dne_new.cf0d4eaae25b78b9dda6.png"
                        alt="teste"
                    >
                </div>

                <div class="menu-container">
                    <img
                        width="50px"
                        src="/static/media/une.6450363de66d34a33e0e.png"
                        alt="teste"
                    >

                    <img
                        height="32"
                        src="data:image/png;base64,..."
                        alt="teste"
                    >
                </div>

            </div>

            <!-- Conteúdo Principal -->
            <div class="container">

                <div
                    style="
                        flex-direction: row;
                        display: flex;
                        justify-content: center;
                    "
                >

                    <!-- Foto -->
                    <div class="card">
                        <img
                            class="foto"
                            src="/static/media/foto3x4.64620e0df503b6e6e7ce.png"
                            alt="teste"
                        >
                    </div>

                    <div style="width: 3%;"></div>

                    <!-- QR Code -->
                    <div class="card qrcode-container">

                        <div class="canvas-block">
                            <canvas
                                id="canvas"
                                class="qrcode-canvas"
                                width="255"
                                height="255"
                                style="height: 255px; width: 255px;"
                            ></canvas>
                        </div>

                        <span style="text-align: center;">
                            R6GNTF
                        </span>

                    </div>

                </div>

                <!-- Informações -->
                <div class="info">

                    <span class="title">
                        BEATRIZ TEIXEIRA
                    </span>

                    <p>
                        <span>Ins. Ensino:</span>
                        UNIP
                    </p>

                    <p>
                        <span>Curso:</span>
                        Administração
                    </p>

                    <p>
                        <span>Nível de Ensino:</span>
                        SUPERIOR
                    </p>

                    <p>
                        <span>RG:</span>
                        42233151
                    </p>

                    <p>
                        <span>Data de Nasc:</span>
                        29/06/1994
                    </p>

                    <p>
                        <span>Validade:</span>
                        22/03/2027
                    </p>

                </div>

            </div>

            <!-- Botão Validar -->
            <div class="certified">

                <img
                    width="20"
                    src="data:image/png;base64,..."
                    alt="teste"
                >

                <p class="text">
                    Validar
                </p>

            </div>

        </div>
    </div>
</body>
</html>
